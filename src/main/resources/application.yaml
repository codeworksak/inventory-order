inventory-order:
  rabbitmq:
    queue-name: ${RABBIT_Q:"order-queue"}
    exchange-name: ${RABBIT_EXCHANGE:"fanout.ordering"}
    routing-key: ${RABBIT_ROUTE_KEY:"order-routing"}
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
spring:
  application:
    name: inventory-order
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: orders_db
#    username: "root"
#    password: "mongopass"
#    authentication-database: admin

server:
  port: 8084
